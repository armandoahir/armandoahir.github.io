<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  (function () {
    const key = 'visits_' + new Date().getFullYear() + '_' + (new Date().getMonth() + 1);
    const sessionKey = 'visited_this_session';

    if (!sessionStorage.getItem(sessionKey)) {
      sessionStorage.setItem(sessionKey, '1');
      localStorage.setItem(key, (parseInt(localStorage.getItem(key) || '0') + 1).toString());
    }

    document.getElementById('visit-count').textContent = localStorage.getItem(key);
  })();
</script>
